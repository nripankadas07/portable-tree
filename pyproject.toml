[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "portable-tree"
version = "0.1.0"
description = "Read-only cross-platform filename collision and portability audit."
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Nripanka Das"}]
dependencies = []

[project.scripts]
portable-tree = "portable_tree:main"

[tool.setuptools]
py-modules = ["portable_tree"]
